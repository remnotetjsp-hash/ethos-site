<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha de entrada · Ethos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F8; --surface:#FFFFFF; --ink:#0E0E14; --soft:#4A4D5E; --line:#D9DCE8;
  --accent:#2938CC; --accent-ink:#FFFFFF; --deep:#1800AD; --mist:#E8EBF8; --lav:#BBC7FF; --sereno:#8BA4EF;
  --error:#B3261E; --focus:#2938CC;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E14; --surface:#171822; --ink:#F5F5F8; --soft:#B4B8CC; --line:#2C2E3D;
    --accent:#8BA4EF; --accent-ink:#0E0E14; --deep:#BBC7FF; --mist:#1E2030; --error:#F2B8B5; --focus:#BBC7FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E14; --surface:#171822; --ink:#F5F5F8; --soft:#B4B8CC; --line:#2C2E3D;
  --accent:#8BA4EF; --accent-ink:#0E0E14; --deep:#BBC7FF; --mist:#1E2030; --error:#F2B8B5; --focus:#BBC7FF;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:28px 22px 140px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
.logo{height:34px;width:auto;max-width:100%}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none} :root[data-theme="dark"] .logo-dark{display:block}
.saved{font-size:13px;color:var(--soft)}
/* progress: the three circles move together as the form advances */
[hidden]{display:none !important}
.progress{display:flex;align-items:center;gap:18px;margin:6px 0 26px}
.progress svg{flex:none}
.progress circle{transition:cx .5s ease}
.progress p{margin:0;font-size:14px;color:var(--soft)}
.progress strong{display:block;font-family:Poppins,Inter,sans-serif;font-weight:600;font-size:15px;color:var(--ink)}
h1{font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.15;letter-spacing:-.02em;margin:0 0 14px}
h2{font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:clamp(24px,5vw,30px);line-height:1.2;letter-spacing:-.01em;margin:0 0 6px}
.lead{color:var(--soft);margin:0 0 28px;max-width:60ch}
.intro-list{margin:0 0 30px;padding:0;list-style:none;display:grid;gap:12px}
.intro-list li{display:flex;gap:12px;align-items:flex-start;color:var(--ink)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:9px}
.field{margin:0 0 24px}
label.q,legend.q{display:block;font-weight:600;font-size:16px;margin:0 0 6px;padding:0}
.req{color:var(--accent);font-weight:600;margin-left:2px}
.help{font-size:14px;color:var(--soft);margin:-2px 0 8px}
input[type=text],input[type=email],input[type=tel],select,textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .15s}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.options{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer}
.opt input{accent-color:var(--accent);width:18px;height:18px;flex:none;margin:0}
.opt:has(input:checked){border-color:var(--accent);background:var(--mist)}
.opt:has(input:focus-visible){box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 30%,transparent)}
.scale{display:flex;gap:8px}
.scale .opt{flex:1;justify-content:center;padding:12px 6px}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-top:6px}
.err{display:none;color:var(--error);font-size:14px;margin-top:6px}
.field.invalid input,.field.invalid textarea,.field.invalid select,.field.invalid .opt{border-color:var(--error)}
.field.invalid .err{display:block}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px))}
nav.bar .inner{max-width:680px;margin:0 auto;display:flex;gap:12px;justify-content:space-between}
button{font:inherit;font-weight:600;border-radius:999px;padding:13px 24px;cursor:pointer;border:1.5px solid transparent}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
.summary{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;max-height:340px;overflow:auto;white-space:pre-wrap;font-size:14px;line-height:1.5;margin:0 0 22px}
.send{display:grid;gap:10px;margin:8px 0 18px}
.send button{width:100%}
.note{font-size:14px;color:var(--soft)}
.steps-send{list-style:none;margin:10px 0 18px;padding:0;display:grid;gap:14px}
.steps-send li{display:flex;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px}
.steps-send .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--mist);color:var(--deep);font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:15px;display:grid;place-items:center}
.steps-send div{flex:1;min-width:0}
.steps-send strong{display:block;font-family:Poppins,Inter,sans-serif;font-weight:600}
.steps-send p{margin:2px 0 12px;font-size:14px;color:var(--soft)}
.steps-send button{width:100%}
button.link{background:none;border:0;padding:10px 0;color:var(--accent);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.progress circle{transition:none}}
</style>
</head>

  {id:"palavras",label:"Três palavras que descrevem você como profissional",type:"text",req:true},
  {id:"tom",label:"Como você prefere falar com o público?",type:"radio",req:true,options:["Mais formal e técnico","Equilibrado","Próximo e descontraído"]},
  {id:"logo",label:"Você já tem identidade visual?",type:"radio",options:["Sim, logo e cores","Tenho só o logo","Não tenho"]},
  {id:"cores",label:"Cores de que você gosta, ou que não quer de jeito nenhum",type:"text"},
  {id:"referencias",label:"Perfis de advogados ou marcas que você admira",type:"textarea",help:"@ ou links."},
  {id:"concorrentes",label:"Concorrentes diretos na sua região",type:"textarea"},
  {id:"nunca",label:"O que você não quer de jeito nenhum no seu perfil?",type:"textarea"}
 ]},
 {title:"Redes e presença", intro:"O que já existe hoje, para não começar do zero.", fields:[
  {id:"instagram",label:"@ do Instagram",type:"text",req:true},
  {id:"outras",label:"TikTok, YouTube, site e Google Meu Negócio",type:"textarea",help:"Links ou @ do que você já tiver."},
  {id:"site",label:"Você tem site?",type:"radio",options:["Sim, com domínio próprio","Tenho, mas está desatualizado","Não tenho"]},
  {id:"gmn",label:"Tem perfil no Google Meu Negócio?",type:"radio",options:["Sim, completo","Sim, mas incompleto","Não tenho","Não sei"]},
  {id:"anuncios",label:"Já fez anúncios?",type:"radio",options:["Nunca","Já impulsionei pelo Instagram","Já fiz campanhas no Gerenciador de Anúncios ou no Google Ads"]}
 ]},
 {title:"Gravação e conteúdo", intro:"Os vídeos são o centro do trabalho. Isso nos ajuda a planejar a gravação.", fields:[
  {id:"grava",label:"Você já grava vídeos?",type:"radio",options:["Gravo com frequência","Já gravei algumas vezes","Nunca gravei"]},
  {id:"conforto",label:"Quanto você fica à vontade em frente à câmera?",type:"scale",min:"Nada à vontade",max:"Muito à vontade"},
  {id:"tempo_gravar",label:"Quanto tempo consegue reservar para gravar?",type:"select",options:["Uma manhã ou tarde por mês","Duas vezes por mês","Um pouco toda semana","Ainda não sei"]},
  {id:"local",label:"Onde você pode gravar?",type:"text",help:"Escritório, sala de reunião ou outro espaço."},
  {id:"equip",label:"O que você já tem para gravar?",type:"checks",options:["Celular com boa câmera","Tripé","Ring light ou painel de luz","Microfone de lapela","Nada ainda"]},
  {id:"temas",label:"Temas que você domina e gosta de explicar",type:"textarea"},
  {id:"temas_evita",label:"Temas que prefere evitar",type:"textarea"}
 ]},
 {title:"Objetivos e investimento", intro:"Para montar o plano certo para você.", fields:[
  {id:"objetivo",label:"Qual é o seu principal objetivo agora?",type:"radio",req:true,options:["Conseguir mais clientes","Ser referência na minha área","Entrar em uma nova área","Organizar e profissionalizar minha presença"]},
  {id:"meta6",label:"Onde você quer estar daqui a 6 meses?",type:"textarea"},
  {id:"plano",label:"Plano de interesse",type:"radio",options:["Essencial","Crescimento","Autoridade","Ainda não sei"]},
  {id:"verba",label:"Quanto pensa em investir por mês em anúncios?",type:"select",options:["Ainda não pretendo anunciar","Até R$ 1.500","R$ 1.500 a R$ 3.000","R$ 3.000 a R$ 5.000","Acima de R$ 5.000"],help:"A verba é paga direto ao Meta ou ao Google, à parte do plano."},
  {id:"obs",label:"Algo mais que devemos saber?",type:"textarea"}
 ]}
];

let data = {}; let step = -1; // -1 = intro, STEPS.length = final
try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { data = {}; }
let resumeAt = 0;
try { const s = parseInt(localStorage.getItem(KEY + "-step"), 10); if (!isNaN(s) && s >= 0) resumeAt = Math.min(s, STEPS.length); } catch(e) {}

const main = document.getElementById("main");
const back = document.getElementById("back");
const next = document.getElementById("next");
const saved = document.getElementById("saved");

function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(data)); if (step >= 0) localStorage.setItem(KEY + "-step", String(step)); saved.textContent = "Respostas salvas neste aparelho"; }
  catch(e) { saved.textContent = ""; }
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function fieldHTML(f){
  const v = data[f.id];
  const req = f.req ? '<span class="req" aria-hidden="true">*</span>' : '';
  const help = f.help ? `<p class="help" id="h-${f.id}">${esc(f.help)}</p>` : '';
  const err = `<p class="err" id="e-${f.id}">Responda esta pergunta para continuar.</p>`;
  const desc = `aria-describedby="${f.help ? 'h-'+f.id+' ' : ''}e-${f.id}"`;
  if (["text","email","tel"].includes(f.type))
    return `<div class="field" data-id="${f.id}"><label class="q" for="${f.id}">${esc(f.label)}${req}</label>${help}<input type="${f.type}" id="${f.id}" value="${esc(v||'')}" ${desc} ${f.type==='email'?'autocomplete="email"':''}${f.type==='tel'?'autocomplete="tel" inputmode="tel"':''}>${err}</div>`;
  if (f.type === "textarea")
    return `<div class="field" data-id="${f.id}"><label class="q" for="${f.id}">${esc(f.label)}${req}</label>${help}<textarea id="${f.id}" ${desc}>${esc(v||'')}</textarea>${err}</div>`;
  if (f.type === "select")
    return `<div class="field" data-id="${f.id}"><label class="q" for="${f.id}">${esc(f.label)}${req}</label>${help}<select id="${f.id}" ${desc}><option value="">Selecione</option>${f.options.map(o=>`<option${v===o?' selected':''}>${esc(o)}</option>`).join('')}</select>${err}</div>`;
  if (f.type === "radio" || f.type === "checks"){
    const t = f.type === "radio" ? "radio" : "checkbox";
    const vals = Array.isArray(v) ? v : (v ? [v] : []);
    return `<div class="field" data-id="${f.id}"><fieldset ${desc}><legend class="q">${esc(f.label)}${req}</legend>${help}<div class="options">${f.options.map((o,i)=>`<label class="opt"><input type="${t}" name="${f.id}" value="${esc(o)}"${vals.includes(o)?' checked':''}>${esc(o)}</label>`).join('')}</div></fieldset>${err}</div>`;
  }
  if (f.type === "scale")
    return `<div class="field" data-id="${f.id}"><fieldset ${desc}><legend class="q">${esc(f.label)}${req}</legend>${help}<div class="scale">${[1,2,3,4,5].map(n=>`<label class="opt"><input type="radio" name="${f.id}" value="${n}"${String(v)===String(n)?' checked':''}>${n}</label>`).join('')}</div><div class="scale-ends"><span>${esc(f.min)}</span><span>${esc(f.max)}</span></div></fieldset>${err}</div>`;
  return "";
}

function read(f){
  if (["text","email","tel","textarea","select"].includes(f.type)) return (document.getElementById(f.id)?.value || "").trim();
  if (f.type === "checks") return [...document.querySelectorAll(`input[name="${f.id}"]:checked`)].map(i=>i.value);
  const c = document.querySelector(`input[name="${f.id}"]:checked`); return c ? c.value : "";
}
function collect(){
  if (step < 0 || step >= STEPS.length) return;
  STEPS[step].fields.forEach(f => { data[f.id] = read(f); });
  persist();
}
function validate(){
  let first = null;
  STEPS[step].fields.forEach(f => {
    const box = main.querySelector(`.field[data-id="${f.id}"]`);
    const v = data[f.id];
    const empty = Array.isArray(v) ? v.length === 0 : !v;
    const bad = !!(f.req && empty);
    box.classList.toggle("invalid", bad);
    if (bad && !first) first = box;
  });
  if (first){ const el = first.querySelector("input,textarea,select"); el && el.focus(); first.scrollIntoView({block:"center"}); return false; }
  return true;
}

function setProgress(){
  const prog = document.getElementById("progress");
  if (step < 0){ prog.hidden = true; return; }
  prog.hidden = false;
  const total = STEPS.length + 1, k = Math.min(step, STEPS.length) / STEPS.length; // 0..1
  // spread (24,48,72) -> converged like the symbol (30,38,47)
  const lerp = (a,b) => a + (b - a) * k;
  document.getElementById("c1").setAttribute("cx", lerp(24,30));
  document.getElementById("c2").setAttribute("cx", lerp(48,38));
  document.getElementById("c3").setAttribute("cx", lerp(72,47));
  document.getElementById("stepName").textContent = step < STEPS.length ? STEPS[step].title : "Revisar e enviar";
  document.getElementById("stepCount").textContent = `Etapa ${Math.min(step+1,total)} de ${total}`;
}

function summaryText(){
  const lines = [`FICHA DE ENTRADA ETHOS`, `${data.nome || ""}${data.oab ? " · OAB " + data.oab : ""}`, `Enviada em ${new Date().toLocaleDateString("pt-BR")}`, ""];
  STEPS.forEach(s => {
    lines.push(`## ${s.title.toUpperCase()}`);
    s.fields.forEach(f => {
      let v = data[f.id]; if (Array.isArray(v)) v = v.join(", ");
      if (f.type === "scale" && v) v = `${v} de 5`;
      lines.push(`${f.label}: ${v ? v : "—"}`);
    });
    lines.push("");
  });
  lines.push("Autorizações: uso das informações pela Ethos (LGPD) e veracidade de formação e títulos confirmadas.");
  return lines.join("\n");
}

function render(){
  setProgress();
  window.scrollTo(0,0);
  if (step < 0){
    main.innerHTML = `<h1>Ficha de entrada</h1>
      <p class="lead">É daqui que a Ethos tira a sua identidade, os temas dos seus vídeos e a estratégia do seu perfil. Quanto mais detalhe, mais o resultado vai parecer com você.</p>
      <ul class="intro-list">
        <li><span class="dot"></span><span>Leva cerca de 15 minutos, em 9 etapas curtas.</span></li>
        <li><span class="dot"></span><span>As respostas ficam salvas neste aparelho enquanto você preenche. Pode parar e voltar depois.</span></li>
        <li><span class="dot"></span><span>Só o que tem asterisco é obrigatório.</span></li>
      </ul>`;
    back.style.visibility = "hidden"; next.textContent = resumeAt > 0 ? "Continuar de onde parei" : "Começar";
    return;
  }
  back.style.visibility = "visible";
  if (step < STEPS.length){
    const s = STEPS[step];
    main.innerHTML = `<h2>${esc(s.title)}</h2><p class="lead" style="margin-bottom:22px">${s.intro}</p>` + s.fields.map(fieldHTML).join("");
    main.querySelectorAll("input,textarea,select").forEach(el => el.addEventListener("change", collect));
    next.textContent = step === STEPS.length - 1 ? "Revisar respostas" : "Continuar";
    next.disabled = false;
    return;
  }
  // final
  const canShareFiles = (() => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(["x"], "t.pdf", { type: "application/pdf" })] })); } catch(e) { return false; } })();
  main.innerHTML = `<h1 style="font-size:clamp(24px,5vw,30px)">Revisar e enviar</h1>
    <p class="lead">Confira as respostas. Para mudar algo, use o botão Voltar.</p>
    <div class="summary" id="sum" tabindex="0" role="region" aria-label="Resumo das respostas">${esc(summaryText())}</div>
    <div class="field" data-id="lgpd"><label class="opt"><input type="checkbox" id="lgpd"${data.lgpd?' checked':''}>Autorizo a Ethos a usar estas informações para criar minha identidade, estratégia e conteúdos, conforme a LGPD.</label></div>
    <div class="field" data-id="verdade"><label class="opt"><input type="checkbox" id="verdade"${data.verdade?' checked':''}>As informações sobre formação e títulos são verdadeiras.</label><p class="err" style="display:none" id="e-ok">Marque as duas autorizações para enviar.</p></div>
    <ol class="steps-send">
      <li><span class="n">1</span><div><strong>Avise a Ethos no WhatsApp</strong><p>A conversa abre com a mensagem pronta. É só tocar em enviar.</p><button type="button" class="${data.waSent ? 'ghost' : 'primary'}" id="wa">Abrir o WhatsApp</button></div></li>
      <li><span class="n">2</span><div><strong>Envie a ficha em PDF</strong><p>${canShareFiles ? "Volte para esta página, toque no botão e escolha a conversa da Ethos no WhatsApp." : "Baixe o PDF e arraste para a conversa da Ethos no WhatsApp Web."}</p><button type="button" class="${data.waSent ? 'primary' : 'ghost'}" id="pdf">${canShareFiles ? "Enviar o PDF da ficha" : "Baixar o PDF da ficha"}</button></div></li>
    </ol>
    <button type="button" class="link" id="copy">Prefere colar o texto? Copiar respostas</button>`;
  back.style.visibility = "visible"; next.style.display = "none";
  loadPDF();
  const okBoxes = () => { data.lgpd = document.getElementById("lgpd").checked; data.verdade = document.getElementById("verdade").checked; persist(); const ok = data.lgpd && data.verdade; document.getElementById("e-ok").style.display = ok ? "none" : "block"; return ok; };
  document.getElementById("lgpd").addEventListener("change", okBoxes);
  document.getElementById("verdade").addEventListener("change", okBoxes);
  document.getElementById("copy").addEventListener("click", async () => {
    if (!okBoxes()) return;
    const txt = summaryText();
    try { await navigator.clipboard.writeText(txt); toast("Respostas copiadas"); }
    catch(e){ const r = document.createRange(); r.selectNodeContents(document.getElementById("sum")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Texto selecionado: copie com o menu do aparelho"); }
  });
  document.getElementById("wa").addEventListener("click", () => {
    if (!okBoxes()) return;
    window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(waMessage())}`, "_blank", "noopener");
    data.waSent = true; persist();
    document.getElementById("wa").className = "ghost"; document.getElementById("pdf").className = "primary";
  });
  document.getElementById("pdf").addEventListener("click", async () => {
    if (!okBoxes()) return;
    if (!window.jspdf){ toast("Preparando o PDF. Toque de novo em instantes."); loadPDF(); return; }
    let file;
    try { file = makePDF(); } catch(e){ toast("Não foi possível gerar o PDF. Use Copiar respostas."); return; }
    if (canShareFiles){
      try { await navigator.share({ files: [file], text: `Ficha de entrada Ethos · ${data.nome || ""}`.trim() }); return; }
      catch(e){ if (e && e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("PDF baixado");
  });
}

function waMessage(){
  const who = (data.nome || "") + (data.oab ? ` (OAB ${data.oab})` : "");
  const lines = [`Olá! Sou ${who || "advogado(a)"} e acabei de preencher a ficha de entrada da Ethos. Em seguida envio o PDF com todas as respostas aqui na conversa.`, ""];
  [["Cidade","cidade"],["WhatsApp","whats"],["E-mail","email"],["Instagram","instagram"],["Área principal","area"],["Objetivo","objetivo"],["Plano de interesse","plano"]]
    .forEach(([k,id]) => { if (data[id]) lines.push(`${k}: ${data[id]}`); });
  return lines.join("\n");
}

// PDF: gerado no próprio aparelho com jsPDF (servido pelo site, licença MIT)
let pdfLoading = null;
function loadPDF(){
  if (window.jspdf || pdfLoading) return;
  pdfLoading = new Promise((res) => { const s = document.createElement("script"); s.src = "/ficha/jspdf.umd.min.js"; s.onload = res; s.onerror = () => { pdfLoading = null; res(); }; document.head.appendChild(s); });
}
// a fonte padrão do PDF cobre o português, mas não emoji nem símbolos raros
const CP1252 = "€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ";
function pdfText(s){
  return String(s == null ? "" : s).normalize("NFC").replace(/\r/g, "")
    .replace(/[→➔➡]/g, "->").replace(/[✓✔✅]/g, "v")
    .split("").filter(c => { const n = c.charCodeAt(0); return c === "\n" || (n >= 32 && n <= 126) || (n >= 160 && n <= 255) || CP1252.includes(c); }).join("")
    .replace(/[ \t]{2,}/g, " ").replace(/[ \t]+\n/g, "\n").trim();
}
function makePDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, H = 297, M = 18, CW = W - 2*M, BOTTOM = H - 20;
  const INK = [14,14,20], SOFT = [74,77,94], MUTED = [150,153,170], ACC = [41,56,204], DEEP = [24,0,173], MIST = [232,235,248];
  const nome = pdfText(data.nome) || "Ficha de entrada";
  const hoje = new Date().toLocaleDateString("pt-BR");
  let y;
  const color = (c) => doc.setTextColor(c[0], c[1], c[2]);
  const font = (style, size) => { doc.setFont("helvetica", style); doc.setFontSize(size); };
  const lineH = (size) => size * 0.3528 * 1.38;
  function newPage(){
    doc.addPage(); y = 22;
    font("bold", 8); color(ACC); doc.text("FICHA DE ENTRADA ETHOS", M, 14);
    font("normal", 8); color(MUTED); doc.text(nome, W - M, 14, { align: "right" });
    doc.setDrawColor(MIST[0], MIST[1], MIST[2]); doc.setLineWidth(0.3); doc.line(M, 16.5, W - M, 16.5);
  }
  const need = (h) => { if (y + h > BOTTOM) newPage(); };

  // capa
  const logo = document.querySelector(".logo-light");
  try { const cv = document.createElement("canvas"); cv.width = 540; cv.height = Math.round(540 * logo.naturalHeight / logo.naturalWidth); cv.getContext("2d").drawImage(logo, 0, 0, cv.width, cv.height); doc.addImage(cv.toDataURL("image/png"), "PNG", M, 14, 36, 36 * cv.height / cv.width, "logo", "FAST"); } catch(e) { font("bold", 20); color(INK); doc.text("Ethos", M, 24); }
  font("bold", 8); color(ACC); doc.text("FICHA DE ENTRADA", W - M, 20, { align: "right" });
  font("normal", 9); color(SOFT); doc.text(`Enviada em ${hoje}`, W - M, 25, { align: "right" });

  y = 50;
  font("bold", 22); color(INK);
  doc.splitTextToSize(nome, CW).forEach(l => { doc.text(l, M, y); y += 9; });
  const sub = [data.nome_prof, data.oab ? `OAB ${data.oab}` : "", data.cidade].map(pdfText).filter(Boolean).join("  ·  ");
  if (sub){ font("normal", 10.5); color(SOFT); doc.splitTextToSize(sub, CW).forEach(l => { doc.text(l, M, y - 2); y += 5; }); }
  y += 4;

  // quadro de contato
  const facts = [["WhatsApp","whats"],["E-mail","email"],["Instagram","instagram"],["Área principal","area"],["Objetivo","objetivo"],["Plano de interesse","plano"]]
    .map(([k,id]) => [k, pdfText(data[id]) || "Não respondido"]);
  const colW = (CW - 12) / 2, rowH = 12.5, boxH = Math.ceil(facts.length / 2) * rowH + 8;
  doc.setFillColor(MIST[0], MIST[1], MIST[2]); doc.roundedRect(M, y, CW, boxH, 4, 4, "F");
  facts.forEach(([k, v], i) => {
    const cx = M + 6 + (i % 2) * (colW + 0), cy = y + 8 + Math.floor(i / 2) * rowH;
    font("bold", 7.5); color(SOFT); doc.text(k.toUpperCase(), cx, cy);
    font("normal", 10.5); color(INK); doc.text(doc.splitTextToSize(v, colW - 4)[0], cx, cy + 5);
  });
  y += boxH + 10;

  // seções
  STEPS.forEach((s, si) => {
    need(26);
    font("bold", 9); color(ACC); doc.text(String(si + 1).padStart(2, "0"), M, y);
    font("bold", 14); color(INK); doc.text(pdfText(s.title), M + 9, y);
    y += 3; doc.setDrawColor(ACC[0], ACC[1], ACC[2]); doc.setLineWidth(0.5); doc.line(M, y, M + 12, y);
    doc.setDrawColor(MIST[0], MIST[1], MIST[2]); doc.setLineWidth(0.3); doc.line(M + 12, y, W - M, y);
    y += 7;
    s.fields.forEach(f => {
      let v = data[f.id]; if (Array.isArray(v)) v = v.join(", ");
      if (f.type === "scale" && v) v = `${v} de 5 (1 = ${f.min}, 5 = ${f.max})`;
      const empty = !v;
      const label = doc.splitTextToSize(pdfText(f.label), CW);
      font(empty ? "italic" : "normal", 10.5);
      const val = doc.splitTextToSize(empty ? "Não respondido" : pdfText(v), CW);
      const hLabel = label.length * lineH(8.5), hVal = val.length * lineH(10.5);
      if (hLabel + hVal + 5 <= BOTTOM - 22) need(hLabel + Math.min(hVal, lineH(10.5) * 3) + 5);
      font("bold", 8.5); color(SOFT); label.forEach(l => { doc.text(l, M, y); y += lineH(8.5); });
      y += 0.8;
      val.forEach(l => { need(lineH(10.5)); font(empty ? "italic" : "normal", 10.5); color(empty ? MUTED : INK); doc.text(l, M, y); y += lineH(10.5); });
      y += 4;
    });
    y += 4;
  });

  // autorizações
  need(24);
  doc.setDrawColor(MIST[0], MIST[1], MIST[2]); doc.setLineWidth(0.3); doc.line(M, y, W - M, y); y += 7;
  font("bold", 9); color(INK); doc.text("Autorizações", M, y); y += 5;
  font("normal", 9); color(SOFT);
  ["Autorizou a Ethos a usar estas informações para criar identidade, estratégia e conteúdos, conforme a LGPD.",
   "Declarou que as informações sobre formação e títulos são verdadeiras."]
    .forEach(t => doc.splitTextToSize("•  " + t, CW).forEach(l => { need(5); doc.text(l, M, y); y += 4.6; }));

  // rodapé
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++){
    doc.setPage(i); font("normal", 7.5); color(MUTED);
    doc.text("Ethos · Marketing jurídico · ethosmarketingjuridico.com.br", M, H - 10);
    doc.text(`Página ${i} de ${n}`, W - M, H - 10, { align: "right" });
  }
  doc.setProperties({ title: `Ficha de entrada Ethos · ${nome}`, author: nome, creator: "Ethos" });
  const fname = `Ficha Ethos - ${nome.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w ]+/g, "").trim() || "cliente"}.pdf`;
  return new File([doc.output("blob")], fname, { type: "application/pdf" });
}

function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"), 2200); }

next.addEventListener("click", () => {
  if (step < 0){ step = resumeAt; }
  else { collect(); if (!validate()) return; step++; }
  next.style.display = ""; persist(); render();
});
back.addEventListener("click", () => {
  collect(); step = step >= STEPS.length ? STEPS.length - 1 : step - 1;
  next.style.display = ""; persist(); render();
});
render();
</script>
